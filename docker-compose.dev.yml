version: '3.8'

# Docker Compose para desenvolvimento
# Apenas banco de dados e Redis - API e Client rodam localmente

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sherlock-postgres-dev
    environment:
      POSTGRES_USER: sherlock_admin
      POSTGRES_PASSWORD: SuperSecure123!
      POSTGRES_DB: sherlock_dev_db
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock_admin -d sherlock_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sherlock-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  # Caixa de entrada falsa para desenvolvimento: aceita qualquer SMTP na 1025 e
  # mostra o que chegou em http://localhost:8025. Nenhuma mensagem sai da maquina.
  #   docker compose -f docker-compose.dev.yml up -d mailpit
  # e na API: Email__Enabled=true (host/porta ja sao o padrao do appsettings.json)
  mailpit:
    image: axllent/mailpit:latest
    container_name: sherlock-mailpit-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interface web
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
