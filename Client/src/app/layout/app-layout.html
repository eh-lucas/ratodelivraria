<div class="layout" [class.sidebar-collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">
  @if (mobileOpen()) {
    <div class="overlay" (click)="closeMobile()"></div>
  }

  <app-sidebar
    [collapsed]="collapsed()"
    (toggle)="toggleSidebar()"
    (navigate)="closeMobile()">
  </app-sidebar>

  <div class="main">
    <app-header (menuToggle)="toggleSidebar()"></app-header>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
