<aside class="sidebar" [class.collapsed]="collapsed">
  <button class="sidebar-item toggle" (click)="onToggle()" [attr.aria-label]="collapsed ? 'Expandir menu' : 'Recolher menu'" [title]="collapsed ? 'Expandir menu' : 'Recolher menu'">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <a routerLink="/search" class="sidebar-item" [class.active]="isActive('/search') || isActive('/resultado')" (click)="onItemClick()" [title]="'Pesquisar' | t">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" stroke-width="2"/>
      <path stroke-linecap="round" stroke-width="2" d="M21 21l-4.35-4.35"/>
    </svg>
    <span class="label">{{ 'Pesquisar' | t }}</span>
  </a>

  <a routerLink="/watched" class="sidebar-item" [class.active]="isActive('/watched')" (click)="onItemClick()" [title]="'Observados' | t">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
      <circle cx="12" cy="12" r="3" stroke-width="2"/>
    </svg>
    <span class="label">{{ 'Observados' | t }}</span>
  </a>

  <a routerLink="/history" class="sidebar-item" [class.active]="isActive('/history')" (click)="onItemClick()" [title]="'Histórico' | t">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4h7l5 5v11a1 1 0 01-1 1H7a1 1 0 01-1-1V5a1 1 0 011-1z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 4v5h5M9 13h6M9 17h6"/>
    </svg>
    <span class="label">{{ 'Histórico' | t }}</span>
  </a>
</aside>
