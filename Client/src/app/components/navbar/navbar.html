@if (isAuthenticated) {
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-content">
        <!-- Logo -->
        <a routerLink="/search" class="navbar-logo">
          <img src="/assets/BookFinIcon3.png" alt="BookFin Logo" />
          <span>BookFin</span>
        </a>

        <!-- Desktop Navigation -->
        <div class="navbar-nav">
          <a
            routerLink="/search"
            class="nav-link"
            [class.active]="isActive('/search')"
          >
            Buscar Livros
          </a>
          <a
            routerLink="/profile"
            class="nav-link"
            [class.active]="isActive('/profile')"
          >
            Meu Perfil
          </a>
        </div>

        <!-- Desktop Actions -->
        <div class="navbar-actions">
          <!-- Credits Badge -->
          @if (userCredits) {
            <a routerLink="/credits" class="credits-badge">
              <svg class="credits-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span class="credits-amount">{{ userCredits.availableCredits }}</span>
              <span class="credits-label">creditos</span>
            </a>
          } @else {
            <a routerLink="/credits" class="credits-badge-loading">
              <div class="placeholder icon"></div>
              <div class="placeholder text"></div>
            </a>
          }

          <!-- Logout Button -->
          <button (click)="logout()" class="btn-logout">
            Sair
          </button>
        </div>

        <!-- Mobile -->
        <div class="navbar-mobile">
          <!-- Mobile Credits Badge -->
          @if (userCredits) {
            <a routerLink="/credits" class="mobile-credits">
              <span>{{ userCredits.availableCredits }}</span>
            </a>
          }

          <button (click)="toggleMenu()" class="btn-menu">
            @if (isMenuOpen) {
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            } @else {
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            }
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" [class.open]="isMenuOpen">
      <div class="mobile-nav">
        <a
          routerLink="/search"
          class="mobile-nav-link"
          [class.active]="isActive('/search')"
        >
          Buscar Livros
        </a>
        <a
          routerLink="/profile"
          class="mobile-nav-link"
          [class.active]="isActive('/profile')"
        >
          Meu Perfil
        </a>
        <a
          routerLink="/credits"
          class="mobile-nav-link"
          [class.active]="isActive('/credits')"
        >
          Comprar Creditos
        </a>
        <button (click)="logout()" class="mobile-logout">
          Sair
        </button>
      </div>
    </div>
  </nav>
}
