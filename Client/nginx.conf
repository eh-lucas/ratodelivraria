events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # API proxy - forward requests to backend
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health endpoint proxy
        location /health {
            proxy_pass http://api:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Static files - Angular app
        location / {
            try_files $uri $uri/ /index.html;
        }

        # O index.html nunca pode ficar em cache.
        #
        # Ele e o unico arquivo com nome fixo, e e dele que sai o nome com hash
        # do bundle. Em cache, a pessoa continua carregando o bundle da versao
        # anterior por tempo indeterminado -- e sem Cache-Control o navegador
        # decide sozinho por quanto tempo (cache heuristico), entao "sem header"
        # nao significa "sem cache".
        #
        # Em 01/11/2026 isso prendeu a raiz do site numa versao em que "/" ainda
        # desviava para /login: quem entrava por https://ratodelivraria.com.br
        # caia no login, enquanto /home -- outra URL, fora do cache -- abria
        # normal. Os bundles com hash no nome continuam com 1 ano logo abaixo:
        # e o index que precisa ser sempre revalidado, nao eles.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
