version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bookfin-postgres
    environment:
      POSTGRES_USER: sherlock_admin
      POSTGRES_PASSWORD: SuperSecure123!
      POSTGRES_DB: sherlock_dev_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock_admin -d sherlock_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookfin-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: bookfin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookfin-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: bookfin-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sherlock_dev_db;Username=sherlock_admin;Password=SuperSecure123!
      - ConnectionStrings__SherlockDb=Host=postgres;Port=5432;Database=sherlock_dev_db;Username=sherlock_admin;Password=SuperSecure123!
      - ConnectionStrings__Redis=redis:6379
      - UseRedis=true
      - JwtSettings__SecretKey=SherlockSuperSecretKey2024!@#$$%^&*DockerEdition
      - JwtSettings__Issuer=BookPricesWatcher
      - JwtSettings__Audience=All
      - JwtSettings__ExpiryInMinutes=120
    ports:
      - "5177:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bookfin-network

  # Angular Client (nginx)
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
    container_name: bookfin-client
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bookfin-network

volumes:
  postgres_data:
  redis_data:

networks:
  bookfin-network:
    driver: bridge
