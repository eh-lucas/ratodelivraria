services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sherlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Lidas pelo script de init para criar o usuario da aplicacao
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script roda so na primeira init (volume vazio): cria o sherlock_app
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: sherlock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: Sherlock.Api/Dockerfile
    container_name: sherlock-api
    restart: unless-stopped
    # Sobrescreve os segredos do appsettings.Docker.json via env (sintaxe __ do ASP.NET Core)
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
      ConnectionStrings__SherlockDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET}
    ports:
      - "5177:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sherlock-network

  # Angular Client (nginx)
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
    container_name: sherlock-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sherlock-network

volumes:
  postgres_data:
  redis_data:

networks:
  sherlock-network:
    driver: bridge
