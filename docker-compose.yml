services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sherlock-postgres
    environment:
      POSTGRES_USER: sherlock_admin
      POSTGRES_PASSWORD: SuperSecure123!
      POSTGRES_DB: sherlock_dev_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock_admin -d sherlock_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: sherlock-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: Sherlock.Api/Dockerfile
    container_name: sherlock-api
    ports:
      - "5177:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sherlock-network

  # Angular Client (nginx)
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
    container_name: sherlock-client
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sherlock-network

volumes:
  postgres_data:
  redis_data:

networks:
  sherlock-network:
    driver: bridge
