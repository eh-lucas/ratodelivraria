# Nome do projeto fixo: sem isto o compose usa o nome da pasta, e renomear a
# pasta criaria volumes novos e vazios (o banco de producao "sumiria").
name: sherlock

# Sem rotação, o json-file do Docker cresce para sempre — e a API loga cada
# requisição e cada loja consultada.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Portas presas ao loopback: a única porta de entrada é o túnel da Cloudflare,
# que roda nesta máquina e fala com localhost:4200. Publicar em 0.0.0.0 deixava
# Postgres, Redis (sem senha) e a API abertos para toda a rede local — e para a
# internet, nos IPv6 globais desta máquina.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sherlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Lidas pelo script de init para criar o usuario da aplicacao
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script roda so na primeira init (volume vazio): cria o sherlock_app
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: sherlock-redis
    restart: unless-stopped
    # Senha obrigatória e teto de memória: é cache, pode descartar o mais antigo.
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"
             --maxmemory 256mb --maxmemory-policy allkeys-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sherlock-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: Sherlock.Api/Dockerfile
    container_name: sherlock-api
    restart: unless-stopped
    # Sobrescreve os segredos do appsettings.Docker.json via env (sintaxe __ do ASP.NET Core)
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
      ConnectionStrings__SherlockDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET}
      # Medido em 2026-08-18 com a busca via JSON: 67 lojas em 17,0s com 10 por vez
      # e 14,3s com 20, enquanto a latência por loja sobe de 2,5s para 3,7s. Acima
      # disso a curva achata e só pressiona o servidor — são 67 domínios em 2 IPs.
      Search__MaxDegreeOfParallelism: "20"
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      # Envio de e-mail. Com EMAIL_ENABLED=false a API nao abre conexao nenhuma e
      # escreve as mensagens no proprio log — ver .env.example.
      # O vigia de preco. Desligado por padrao: ligar manda requisicao para as
      # livrarias (Sweep) e e-mail para gente de verdade (Notify) -- ver
      # docs/PLANO-OBSERVADOS.md §11.
      Watch__SweepEnabled: ${WATCH_SWEEP_ENABLED:-false}
      Watch__NotifyEnabled: ${WATCH_NOTIFY_ENABLED:-false}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-localhost}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__UseStartTls: ${EMAIL_USE_STARTTLS:-false}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-nao-responda@ratodelivraria.com.br}
      Email__FromName: ${EMAIL_FROM_NAME:-ratodelivraria}
    ports:
      - "127.0.0.1:5177:8080"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sherlock-network

  # Angular Client (nginx)
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile.prod
    container_name: sherlock-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sherlock-network

volumes:
  postgres_data:
  redis_data:

networks:
  sherlock-network:
    driver: bridge
